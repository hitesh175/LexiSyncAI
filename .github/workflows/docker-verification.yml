name: Docker verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build, launch, and test LexiSyncAI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and launch with Docker Compose
        run: docker compose up --build --detach
      - name: Check the running app
        run: curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:8501/_stcore/health
      - name: Run the project tests inside Docker
        run: docker compose exec -T app python -m unittest -v
      - name: Verify a cited PDF answer inside Docker
        run: |
          docker compose exec -T app python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from streamlit.testing.v1 import AppTest

          from cases import CaseStore
          from lexic import ingest

          with TemporaryDirectory() as temp:
              os.environ["LEXISYNC_CASE_DB"] = str(Path(temp) / "smoke.sqlite3")
              pdf = Path("data/17-USC-107.pdf")
              documents = {pdf.name: pdf.read_bytes()}
              passages, structure = ingest(documents)
              store = CaseStore(os.environ["LEXISYNC_CASE_DB"])
              case_id = store.save_case("Docker smoke test", documents, passages, structure)
              app = AppTest.from_file("app.py").run()
              next(w for w in app.text_input if w.label == "Type your question").set_value(
                  "What does the second fair use factor consider?"
              )
              next(w for w in app.button if w.label == "Get answer").click().run()
              assert not app.exception and not app.error, (app.exception, app.error)
              answer_id = store.list_answers(case_id)[0][0]
              _, hits, result = store.open_answer(case_id, answer_id)
              assert result["confidence"] == "HIGH" and result["usage"]["calls"] == 0
              claim = result["claims"][0]
              assert "nature of the copyrighted work" in claim["text"]
              citation = claim["evidence"][0]
              source = hits[citation["id"] - 1]
              assert (source.document, source.page, source.section) == (pdf.name, 1, "§107 (2)")
              assert citation["quote"] in source.text and app.get("imgs")
              print("PASS: Exact §107(2) answer, citation on PDF page 1, and PDF preview.")
          PY
      - name: Show app logs on failure
        if: failure()
        run: docker compose logs --no-color app
      - name: Stop the container
        if: always()
        run: docker compose down --volumes
